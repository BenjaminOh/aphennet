# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name api.aphen.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
# ⚠️ 이 파일은 운영서버 실제 설정과 완전히 일치하지 않는다.
#    운영(/root/deploy/nginx-waf/conf.d/api.aphen.net.conf)은 `listen 443 ssl proxy_protocol;`
#    이다(앞단 nginx-proxy 가 PROXY protocol 로 전달). setup-nginx.sh 로 이 파일을
#    그대로 덮어쓰면 API 가 죽는다. 반영 전 운영 설정과 대조할 것.
server {
    listen 443 ssl;
    server_name api.aphen.net;

    ssl_certificate     /etc/nginx/ssl/live/api.aphen.net-0001/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/api.aphen.net-0001/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    include /etc/nginx/conf.d/aphennet-service-url.inc;

    # 2026-08-17: 에디터 본문의 style= 속성·base64 인라인 이미지가 CRS 941xxx(XSS)
    # 룰에 걸려 관리자 게시물 등록/수정이 403 되던 문제.
    # 쓰기 메서드(POST/PUT/PATCH)에 한해 요청 본문 검사만 해제한다.
    # GET 경로 스캐너·경로탐색·.env 탐색 차단은 그대로 유지된다.
    # ※ 운영서버(/root/deploy/nginx-waf/conf.d/api.aphen.net.conf)에 이미 적용됨.
    #    api.apnhi.net 은 id:1011 로 동일 적용 (rule id 는 전역 유일해야 함).
    modsecurity_rules '
    SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH)$" \
      "id:1010,phase:1,pass,nolog,ctl:requestBodyAccess=Off"
    ';

    location / {
        proxy_pass $aphennet_api_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        # 300MB 업로드는 느린 회선에서 60s 를 쉽게 넘긴다.
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 대용량 업로드에서 실제로 요청을 끊는 건 본문 수신 타임아웃이다.
        client_body_timeout 300s;
        client_max_body_size 300M;
    }
}
